                                      speechRecognizer?.stopListening()
                                      ttsEngine?.stop()
                                      mediaPlayer?.stop()
                                      setSystemMicBeepMuted(context, false)
                                      statusMessage = "تم إيقاف جلسة التسميع"
                                  } else {
                                      val perm = ContextCompat.checkSelfPermission(
                                          context,
