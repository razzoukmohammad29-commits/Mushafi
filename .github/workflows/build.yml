name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Organize Project
        run: |
          mkdir -p extracted_project
          unzip -q Mushafi.zip -d extracted_project
          echo "=== Files inside ZIP ==="
          find extracted_project -type f -exec ls -lh {} +

          mkdir -p clean_project/app/src/main

          MAIN_FILE=$(grep -rl "MainActivity" extracted_project | grep -v "\.xml" | head -n 1 || true)
          if [ -z "$MAIN_FILE" ]; then
            MAIN_FILE=$(find extracted_project -type f -iname "*MainActivity*" | head -n 1 || true)
          fi

          PKG="com.example.mushafi"
          if [ -n "$MAIN_FILE" ] && [ -s "$MAIN_FILE" ]; then
            DETECTED_PKG=$(grep -E "^[[:space:]]*package " "$MAIN_FILE" | head -n 1 | awk '{print $2}' | tr -d '\r;' || true)
            if [ -n "$DETECTED_PKG" ]; then
              PKG="$DETECTED_PKG"
            fi
          fi

          PKG_PATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p "clean_project/app/src/main/java/$PKG_PATH"

          if [ -n "$MAIN_FILE" ] && [ -s "$MAIN_FILE" ]; then
            cp "$MAIN_FILE" "clean_project/app/src/main/java/$PKG_PATH/MainActivity.kt"
          else
            echo "WARNING: MainActivity file is missing or empty inside ZIP!"
            find extracted_project -type f -exec head -n 20 {} +
          fi

          cat << 'EOF' > clean_project/settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Mushafi"
          include(":app")
          EOF

          cat << 'EOF' > clean_project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > clean_project/build.gradle.kts
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > clean_project/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "PACKAGE_NAME"
              compileSdk = 34

              defaultConfig {
                  applicationId = "PACKAGE_NAME"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("com.google.code.gson:gson:2.11.0")
          }
          EOF

          sed -i "s/PACKAGE_NAME/$PKG/g" clean_project/app/build.gradle.kts

          cat << 'EOF' > clean_project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="مصحفي"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          echo "=== Final Organized Structure ==="
          find clean_project -type f -exec ls -lh {} +

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK with Gradle
        working-directory: clean_project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: clean_project/app/build/outputs/apk/debug/app-debug.apk
