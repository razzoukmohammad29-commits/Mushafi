          @Composable
          fun QuranSmartScreen(pages: List<QuranPageData>) {
              val context = LocalContext.current
              val focusManager = LocalFocusManager.current
              val mainHandler = remember { Handler(Looper.getMainLooper()) }

              var currentPageIndex by remember { mutableStateOf(0) }
              var pageInputText by remember { mutableStateOf("1") }
              var juzInputText by remember { mutableStateOf("1") }

              var isRecitationMode by remember { mutableStateOf(true) }
              var revealedWordCount by remember { mutableStateOf(0) }
              var cycleStartWordCount by remember { mutableStateOf(0) }
              var hasErrorStop by remember { mutableStateOf(false) }

              var userWantsListening by remember { mutableStateOf(false) }
              var isSheikhSpeaking by remember { mutableStateOf(false) }
              var mistakeCountAtCurrentWord by remember { mutableStateOf(0) }
              var knockedWordIndex by remember { mutableStateOf(-1) }

              var statusMessage by remember {
                  mutableStateOf("اضغط (ابدأ التسميع) ليسمعك الشيخ بصمت ويدق على الطاولة عند الخطأ")
              }

              val currentPage = if (pages.isNotEmpty()) pages[currentPageIndex] else null
              val allPageWords = remember(currentPageIndex, pages) {
                  currentPage?.ayahs?.flatMap { it.words } ?: emptyList()
              }

              var ttsEngine by remember { mutableStateOf<TextToSpeech?>(null) }
              var ttsArabicReady by remember { mutableStateOf(false) }
              var mediaPlayer by remember { mutableStateOf<MediaPlayer?>(null) }

              val speechRecognizer = remember {
                  if (SpeechRecognizer.isRecognitionAvailable(context)) {
                      SpeechRecognizer.createSpeechRecognizer(context)
                  } else null
              }

              fun startRecognizerCycle() {
                  if (!userWantsListening || isSheikhSpeaking || speechRecognizer == null) return
                  setSystemMicBeepMuted(context, true)
                  cycleStartWordCount = revealedWordCount
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2200L)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 1800L)
                  }
                  try {
                      speechRecognizer.startListening(intent)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun scheduleRestartListening(delayMs: Long = 60L) {
                  mainHandler.removeCallbacksAndMessages(null)
                  if (userWantsListening && !isSheikhSpeaking && revealedWordCount < allPageWords.size) {
                      mainHandler.postDelayed({
                          if (userWantsListening && !isSheikhSpeaking && revealedWordCount < allPageWords.size) {
                              startRecognizerCycle()
                          }
                      }, delayMs)
                  }
              }

              fun triggerSheikhReciteAyah() {
                  if (currentPage == null || revealedWordCount >= allPageWords.size) return
                  mainHandler.removeCallbacksAndMessages(null)
                  isSheikhSpeaking = true
                  try { speechRecognizer?.cancel() } catch (_: Exception) {}

                  var runningCount = 0
                  var targetAyah: AyahItem? = null
                  var startWordInAyah = 0
                  for (ayah in currentPage.ayahs) {
                      val nextCount = runningCount + ayah.words.size
                      if (nextCount > revealedWordCount) {
                          targetAyah = ayah
                          startWordInAyah = revealedWordCount - runningCount
                          revealedWordCount = nextCount
                          cycleStartWordCount = nextCount
                          break
                      }
                      runningCount = nextCount
                  }

                  hasErrorStop = false
                  mistakeCountAtCurrentWord = 0
                  knockedWordIndex = -1

                  val ayahToRead = targetAyah ?: return
                  val remainingWordsText = ayahToRead.words.drop(startWordInAyah).joinToString(" ")
                  statusMessage = "الشيخ يلقنك الآية (${ayahToRead.numberInSurah}): « $remainingWordsText »"

                  val onSheikhFinished = {
                      mainHandler.post {
                          isSheikhSpeaking = false
                          if (userWantsListening && revealedWordCount < allPageWords.size) {
                              statusMessage = "أكمل التلاوة بعد تلقين الشيخ.."
                              scheduleRestartListening(100L)
                          } else if (revealedWordCount >= allPageWords.size) {
                              userWantsListening = false
                              setSystemMicBeepMuted(context, false)
                              statusMessage = "ما شاء الله! أتممت تلاوة الصفحة بنجاح."
                          }
                      }
                  }

                  if (ttsArabicReady && ttsEngine != null) {
                      val params = Bundle()
                      ttsEngine?.speak(remainingWordsText, TextToSpeech.QUEUE_FLUSH, params, "SHEIKH_AYAH")
                  } else {
                      try {
                          mediaPlayer?.release()
                          val mp = MediaPlayer()
                          mediaPlayer = mp
                          mp.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          mp.setDataSource("https://cdn.islamic.network/quran/audio/64/ar.husary/${ayahToRead.globalNumber}.mp3")
                          mp.setOnPreparedListener { it.start() }
                          mp.setOnCompletionListener { onSheikhFinished() }
                          mp.setOnErrorListener { _, _, _ ->
                              onSheikhFinished()
                              true
                          }
                          mp.prepareAsync()
                      } catch (_: Exception) {
                          onSheikhFinished()
                      }
                  }
              }

              fun evaluateSpokenCandidates(candidates: List<String>, isFinalResult: Boolean) {
                  if (isSheikhSpeaking || allPageWords.isEmpty() || revealedWordCount >= allPageWords.size) return

                  var bestReachedWordCount = revealedWordCount
                  var bestUnmatchedTail = Int.MAX_VALUE
                  var sampleWrongWord = ""

                  for (sentence in candidates) {
                      val spokenWords = sentence.trim()
                          .split(Regex("\\s+"))
                          .filter { normalizeArabicWord(it).isNotEmpty() }
                      if (spokenWords.isEmpty()) continue

                      var simCursor = cycleStartWordCount
                      var sIdx = 0
                      var unmatchedAfterProgress = 0
                      var firstWrong = ""

                      while (sIdx < spokenWords.size && simCursor < allPageWords.size) {
                          val sw = spokenWords[sIdx]
                          val expected = allPageWords[simCursor]

                          if (wordsMatch(expected, sw)) {
                              simCursor++
                              sIdx++
                              unmatchedAfterProgress = 0
                              continue
                          }

                          if (sIdx + 1 < spokenWords.size &&
                              wordsMatch(expected, sw + spokenWords[sIdx + 1])
                          ) {
                              simCursor++
                              sIdx += 2
                              unmatchedAfterProgress = 0
                              continue
                          }

                          if (simCursor + 1 < allPageWords.size &&
                              wordsMatch(expected + allPageWords[simCursor + 1], sw)
                          ) {
                              simCursor += 2
                              sIdx++
                              unmatchedAfterProgress = 0
                              continue
                          }

                          if (simCursor > 0 && wordsMatch(allPageWords[simCursor - 1], sw)) {
                              sIdx++
                              continue
                          }

                          if (simCursor + 1 < allPageWords.size &&
                              wordsMatch(allPageWords[simCursor + 1], sw) &&
                              normalizeArabicWord(expected).length <= 3
                          ) {
                              simCursor += 2
                              sIdx++
                              unmatchedAfterProgress = 0
                              continue
                          }

                          if (firstWrong.isEmpty()) firstWrong = sw
                          unmatchedAfterProgress++
                          sIdx++
                      }

                      if (simCursor > bestReachedWordCount ||
                          (simCursor == bestReachedWordCount && unmatchedAfterProgress < bestUnmatchedTail)
                      ) {
                          bestReachedWordCount = simCursor
                          bestUnmatchedTail = unmatchedAfterProgress
                          sampleWrongWord = firstWrong
                      }
                  }

                  if (bestReachedWordCount > revealedWordCount) {
                      revealedWordCount = bestReachedWordCount
                      hasErrorStop = false
                      mistakeCountAtCurrentWord = 0
                      knockedWordIndex = -1
                      mainHandler.removeCallbacksAndMessages(null)

                      if (revealedWordCount >= allPageWords.size) {
                          userWantsListening = false
                          speechRecognizer?.stopListening()
                          setSystemMicBeepMuted(context, false)
                          statusMessage = "ما شاء الله! أتممت تلاوة هذه الصفحة بالكامل بنجاح."
                          return
                      } else {
                          statusMessage = "تلاوة صحيحة.. الشيخ يستمع إليك"
                      }
                  }

                  val confirmedMistake = (isFinalResult && bestUnmatchedTail >= 1 && bestReachedWordCount == revealedWordCount) ||
                                         (!isFinalResult && bestUnmatchedTail >= 3 && bestReachedWordCount == revealedWordCount)

                  if (confirmedMistake && sampleWrongWord.isNotEmpty()) {
                      if (knockedWordIndex != revealedWordCount) {
                          knockedWordIndex = revealedWordCount
                          mistakeCountAtCurrentWord = 1
                          hasErrorStop = true
                          playTableKnockSound()
                          statusMessage = "دقة الشيخ على الطاولة! أعد الكلمة، وإذا لم تعرفها سيلقنك الشيخ الآية"

                          mainHandler.removeCallbacksAndMessages(null)
                          mainHandler.postDelayed({
                              if (userWantsListening && hasErrorStop && revealedWordCount == knockedWordIndex) {
                                  triggerSheikhReciteAyah()
                              }
                          }, 5000L)
                      } else if (isFinalResult) {
                          triggerSheikhReciteAyah()
                      }
                  }
              }

              LaunchedEffect(Unit) {
                  ttsEngine = TextToSpeech(context) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          ttsEngine?.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                                  .build()
                          )
                          val res = ttsEngine?.setLanguage(Locale("ar"))
                          ttsArabicReady = (res != TextToSpeech.LANG_MISSING_DATA && res != TextToSpeech.LANG_NOT_SUPPORTED)
                          ttsEngine?.setSpeechRate(0.88f)
                          ttsEngine?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onDone(utteranceId: String?) {
                                  mainHandler.post {
                                      isSheikhSpeaking = false
                                      if (userWantsListening && revealedWordCount < allPageWords.size) {
                                          statusMessage = "أكمل التلاوة بعد تلقين الشيخ.."
                                          scheduleRestartListening(80L)
                                      }
                                  }
                              }
                              override fun onError(utteranceId: String?) {
                                  mainHandler.post {
                                      isSheikhSpeaking = false
                                      if (userWantsListening && revealedWordCount < allPageWords.size) {
                                          scheduleRestartListening(80L)
                                      }
                                  }
                              }
                          })
                      }
                  }
              }

              LaunchedEffect(speechRecognizer) {
                  speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {
                          if (!hasErrorStop && !isSheikhSpeaking) {
                              statusMessage = "الشيخ يستمع لتلاوتك بصمت.. اقرأ الآن"
                          }
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          if (userWantsListening && !isSheikhSpeaking) {
                              scheduleRestartListening(80L)
                          }
                      }
                      override fun onResults(results: Bundle?) {
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              evaluateSpokenCandidates(matches, isFinalResult = true)
                          }
                          if (userWantsListening && !isSheikhSpeaking && revealedWordCount < allPageWords.size) {
                              scheduleRestartListening(50L)
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              evaluateSpokenCandidates(matches, isFinalResult = false)
                          }
                      }
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              LaunchedEffect(currentPageIndex) {
                  revealedWordCount = 0
                  cycleStartWordCount = 0
                  hasErrorStop = false
                  mistakeCountAtCurrentWord = 0
                  knockedWordIndex = -1
                  if (currentPage != null) {
                      pageInputText = currentPage.page.toString()
                      juzInputText = currentPage.juz.toString()
                      statusMessage = "أنت في ${currentPage.surah} - صفحة ${currentPage.page} (الجزء ${currentPage.juz})"
                  }
              }

              DisposableEffect(Unit) {
                  onDispose {
                      mainHandler.removeCallbacksAndMessages(null)
                      setSystemMicBeepMuted(context, false)
                      speechRecognizer?.destroy()
                      ttsEngine?.stop()
                      ttsEngine?.shutdown()
                      mediaPlayer?.release()
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
