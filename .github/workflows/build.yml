  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract and Organize Project
        run: |
          mkdir -p extracted_project
          unzip -q Mushafi.zip -d extracted_project

          mkdir -p clean_project/app/src/main/java/com/example/mushafi
          mkdir -p clean_project/app/src/main/assets
          mkdir -p clean_project/app/src/main/res/mipmap-hdpi
          mkdir -p clean_project/app/src/main/res/mipmap-mdpi
          mkdir -p clean_project/app/src/main/res/mipmap-xhdpi
          mkdir -p clean_project/app/src/main/res/mipmap-xxhdpi
          mkdir -p clean_project/app/src/main/res/mipmap-xxxhdpi

          if [ -f "Frame.png" ]; then
            sudo apt-get update -y && sudo apt-get install -y imagemagick
            convert Frame.png -resize 72x72 clean_project/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert Frame.png -resize 48x48 clean_project/app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert Frame.png -resize 96x96 clean_project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert Frame.png -resize 144x144 clean_project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert Frame.png -resize 192x192 clean_project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp clean_project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png clean_project/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          fi

          cat << 'EOF' > fetch_quran.py
          import urllib.request
          import json
          import re

          url = "https://api.alquran.cloud/v1/quran/quran-simple"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=60) as response:
              data = json.loads(response.read().decode('utf-8'))

          def has_arabic_letters(token):
              return bool(re.search(r'[\u0621-\u064A\u0671]', token))

          def clean_and_merge_pause_marks(text):
              raw_tokens = text.strip().split()
              merged = []
              pending_prefix = ""
              for token in raw_tokens:
                  if has_arabic_letters(token):
                      if pending_prefix:
                          token = pending_prefix + " " + token
                          pending_prefix = ""
                      merged.append(token)
                  else:
                      if merged:
                          merged[-1] = merged[-1] + " " + token
                      else:
                          pending_prefix = token
              return " ".join(merged), merged

          pages = {}
          for surah in data['data']['surahs']:
              surah_name = surah['name']
              for ayah in surah['ayahs']:
                  p = ayah['page']
                  j = ayah['juz']
                  global_num = ayah['number']
                  cleaned_text, word_list = clean_and_merge_pause_marks(ayah['text'])
                  num = ayah['numberInSurah']
                  if p not in pages:
                      pages[p] = {
                          "page": p,
                          "juz": j,
                          "surah": surah_name,
                          "ayahs": []
                      }
                  pages[p]["ayahs"].append({
                      "s": surah_name,
                      "n": num,
                      "g": global_num,
                      "t": cleaned_text,
                      "w": word_list
                  })

          result = [pages[k] for k in sorted(pages.keys())]
          with open("clean_project/app/src/main/assets/quran_pages.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False)
          print(f"Successfully generated {len(result)} pages of the Quran.")
          EOF

          python3 fetch_quran.py

