          // تطبيع النص القرآني والإملائي مع معالجة الألف الخنجرية والرسم العثماني
          fun normalizeArabicForms(input: String): List<String> {
              val base = input.trim()
                  .replace(Regex("[\\u0610-\\u061A\\u064B-\\u065F\\u06D6-\\u06ED\\u0640]"), "")
                  .replace(Regex("[أإآٱءؤئ]"), "ا")
                  .replace("ة", "ه")
                  .replace("ى", "ي")
                  .replace("الرحمان", "الرحمن")
                  .replace("صلوه", "صلاه")
                  .replace("زكوه", "زكاه")
                  .replace("حيوه", "حياه")
                  .replace("غدوه", "غداه")
                  .replace("مشكوه", "مشكاه")
                  .replace("نجوه", "نجاه")
                  .replace("ربوا", "ربا")

              // نختبر الكلمة مع تحويل الألف الخنجرية (\u0670) إلى ألف، ومع حذفها (مثل ذلك / العالمين)
              val withAlif = base.replace("\u0670", "ا")
                  .replace(Regex("ا+"), "ا")
                  .replace(Regex("[^\\u0621-\\u064A]"), "")
              val withoutAlif = base.replace("\u0670", "")
                  .replace(Regex("ا+"), "ا")
                  .replace(Regex("[^\\u0621-\\u064A]"), "")

              return listOf(withAlif, withoutAlif).distinct().filter { it.isNotEmpty() }
          }

          fun normalizeArabicWord(input: String): String {
              return normalizeArabicForms(input).firstOrNull() ?: ""
          }

          // استخراج الجذر الصامت للكلمة لتجاوز فروق الرسم القرآني والهمزات والمدود
          fun extractConsonantSkeleton(word: String): String {
              var s = normalizeArabicWord(word)
              for (prefix in listOf("وال", "فال", "بال", "كال", "لل", "ال", "و", "ف", "ب", "ل")) {
                  if (s.length > prefix.length + 1 && s.startsWith(prefix)) {
                      s = s.removePrefix(prefix)
                      break
                  }
              }
              s = s.replace("ص", "س")
                  .replace("ض", "ظ")
                  .replace("ذ", "ز")
                  .replace("ط", "ت")
                  .replace("ق", "ك")
              val stripped = s.replace(Regex("[اوي]"), "")
              return if (stripped.isNotEmpty()) stripped else s
          }

          fun levenshteinDistance(a: String, b: String): Int {
              if (a == b) return 0
              if (a.isEmpty()) return b.length
              if (b.isEmpty()) return a.length
              val dp = IntArray(b.length + 1) { it }
              for (i in 1..a.length) {
                  var prev = dp[0]
                  dp[0] = i
                  for (j in 1..b.length) {
                      val temp = dp[j]
                      val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                      dp[j] = min(min(dp[j] + 1, dp[j - 1] + 1), prev + cost)
                      prev = temp
                  }
              }
              return dp[b.length]
          }

          fun wordsMatch(expected: String, spoken: String): Boolean {
              val eForms = normalizeArabicForms(expected)
              val sForms = normalizeArabicForms(spoken)
              if (eForms.isEmpty() || sForms.isEmpty()) return false

              for (e in eForms) {
                  for (s in sForms) {
                      if (e == s) return true
                      val eNoAl = e.removePrefix("ال")
                      val sNoAl = s.removePrefix("ال")
                      if (eNoAl == sNoAl && eNoAl.isNotEmpty()) return true
                      if (e.removePrefix("و") == s || s.removePrefix("و") == e) return true
                      if (e.removePrefix("ف") == s || s.removePrefix("ف") == e) return true
                      if (e.removePrefix("ب") == s || s.removePrefix("ب") == e) return true
                      if (e.removePrefix("ل") == s || s.removePrefix("ل") == e) return true
                      if (e.removeSuffix("ا") == s || s.removeSuffix("ا") == e) return true
                      if (e.removeSuffix("و") == s || s.removeSuffix("و") == e) return true
                      if (e.removeSuffix("ي") == s || s.removeSuffix("ي") == e) return true

                      // مطابقة الحروف المقطعة في أوائل السور
                      if (e == "الم" && (s == "الف" || s == "لام" || s == "ميم" || s == "الم")) return true
                      if (e == "يس" && (s == "ياسين" || s == "يس")) return true
                      if (e == "طه" && (s == "طاها" || s == "طه")) return true
                      if (e == "حم" && (s == "حاميم" || s == "حم")) return true

                      if (e.length >= 4 && s.length >= 4 && abs(e.length - s.length) <= 1) {
                          if (levenshteinDistance(e, s) <= 1) return true
                      }
                  }
              }

              // مطابقة الهيكل الصامت للكلمة (يتجاوز اختلافات الألف الخنجرية والهمزات والمدود)
              val eSkel = extractConsonantSkeleton(expected)
              val sSkel = extractConsonantSkeleton(spoken)
              if (eSkel.length >= 2 && eSkel == sSkel) return true
              if (eSkel.length >= 4 && sSkel.length >= 4 && levenshteinDistance(eSkel, sSkel) <= 1) return true

              return false
          }

