          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalFocusManager
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.SpanStyle
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.KeyboardType
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.withStyle
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import kotlin.math.abs
          import kotlin.math.min

          data class AyahItem(
              val surahName: String,
              val numberInSurah: Int,
              val text: String,
              val words: List<String>
          )

          data class QuranPageData(
              val page: Int,
              val juz: Int,
              val surah: String,
              val ayahs: List<AyahItem>
          )

          fun convertArabicDigitsToEnglish(input: String): String {
              val arabicDigits = charArrayOf('٠','١','٢','٣','٤','٥','٦','٧','٨','٩')
              val sb = StringBuilder()
              for (ch in input) {
                  val idx = arabicDigits.indexOf(ch)
                  if (idx >= 0) sb.append(idx) else if (ch in '0'..'9') sb.append(ch)
              }
              return sb.toString()
          }

          fun normalizeArabicForms(input: String): List<String> {
              val base = input.trim()
                  .replace(Regex("[\\u0610-\\u061A\\u064B-\\u065F\\u06D6-\\u06ED\\u0640]"), "")
                  .replace(Regex("[أإآٱءؤئ]"), "ا")
                  .replace("ة", "ه")
                  .replace("ى", "ي")
                  .replace("الرحمان", "الرحمن")
                  .replace("صلوه", "صلاه")
                  .replace("زكوه", "زكاه")
                  .replace("حيوه", "حياه")
                  .replace("غدوه", "غداه")
                  .replace("مشكوه", "مشكاه")
                  .replace("نجوه", "نجاه")
                  .replace("ربوا", "ربا")

              val withAlif = base.replace("\u0670", "ا")
                  .replace(Regex("ا+"), "ا")
                  .replace(Regex("[^\\u0621-\\u064A]"), "")
              val withoutAlif = base.replace("\u0670", "")
                  .replace(Regex("ا+"), "ا")
                  .replace(Regex("[^\\u0621-\\u064A]"), "")

              return listOf(withAlif, withoutAlif).distinct().filter { it.isNotEmpty() }
          }

          fun normalizeArabicWord(input: String): String {
              return normalizeArabicForms(input).firstOrNull() ?: ""
          }

          fun extractConsonantSkeleton(word: String): String {
              var s = normalizeArabicWord(word)
              for (prefix in listOf("وال", "فال", "بال", "كال", "لل", "ال", "و", "ف", "ب", "ل")) {
                  if (s.length > prefix.length + 1 && s.startsWith(prefix)) {
                      s = s.removePrefix(prefix)
                      break
                  }
              }
              s = s.replace("ص", "س")
                  .replace("ض", "ظ")
                  .replace("ذ", "ز")
                  .replace("ط", "ت")
                  .replace("ق", "ك")
              val stripped = s.replace(Regex("[اوي]"), "")
              return if (stripped.isNotEmpty()) stripped else s
          }

          fun levenshteinDistance(a: String, b: String): Int {
              if (a == b) return 0
              if (a.isEmpty()) return b.length
              if (b.isEmpty()) return a.length
              val dp = IntArray(b.length + 1) { it }
              for (i in 1..a.length) {
                  var prev = dp[0]
                  dp[0] = i
                  for (j in 1..b.length) {
                      val temp = dp[j]
                      val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                      dp[j] = min(min(dp[j] + 1, dp[j - 1] + 1), prev + cost)
                      prev = temp
                  }
              }
              return dp[b.length]
          }

          fun wordsMatch(expected: String, spoken: String): Boolean {
              val eForms = normalizeArabicForms(expected)
              val sForms = normalizeArabicForms(spoken)
              if (eForms.isEmpty() || sForms.isEmpty()) return false

              for (e in eForms) {
                  for (s in sForms) {
                      if (e == s) return true
                      val eNoAl = e.removePrefix("ال")
                      val sNoAl = s.removePrefix("ال")
                      if (eNoAl == sNoAl && eNoAl.isNotEmpty()) return true
                      if (e.removePrefix("و") == s || s.removePrefix("و") == e) return true
                      if (e.removePrefix("ف") == s || s.removePrefix("ف") == e) return true
                      if (e.removePrefix("ب") == s || s.removePrefix("ب") == e) return true
                      if (e.removePrefix("ل") == s || s.removePrefix("ل") == e) return true
                      if (e.removeSuffix("ا") == s || s.removeSuffix("ا") == e) return true
                      if (e.removeSuffix("و") == s || s.removeSuffix("و") == e) return true
                      if (e.removeSuffix("ي") == s || s.removeSuffix("ي") == e) return true

                      if (e == "الم" && (s == "الف" || s == "لام" || s == "ميم" || s == "الم")) return true
                      if (e == "يس" && (s == "ياسين" || s == "يس")) return true
                      if (e == "طه" && (s == "طاها" || s == "طه")) return true
                      if (e == "حم" && (s == "حاميم" || s == "حم")) return true

                      if (e.length >= 4 && s.length >= 4 && abs(e.length - s.length) <= 1) {
                          if (levenshteinDistance(e, s) <= 1) return true
                      }
                  }
              }

              val eSkel = extractConsonantSkeleton(expected)
              val sSkel = extractConsonantSkeleton(spoken)
              if (eSkel.length >= 2 && eSkel == sSkel) return true
              if (eSkel.length >= 4 && sSkel.length >= 4 && levenshteinDistance(eSkel, sSkel) <= 1) return true

              return false
          }

          // تجاهل كلمات الاستعاذة والبسملة إذا قالها القارئ في بداية الصفحة
          val ignoredIntroWords = setOf(
              "اعوذ", "بالله", "من", "الشيطان", "الرجيم", "بسم", "الله", "الرحمن", "الرحيم"
          )

          fun setSystemMicBeepMuted(context: Context, mute: Boolean) {
              val audioManager = context.getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return
              val direction = if (mute) AudioManager.ADJUST_MUTE else AudioManager.ADJUST_UNMUTE
              try { audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, direction, 0) } catch (_: Exception) {}
              try { audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, direction, 0) } catch (_: Exception) {}
              try { audioManager.adjustStreamVolume(AudioManager.STREAM_MUSIC, direction, 0) } catch (_: Exception) {}

              if (mute) {
                  try {
                      val maxAlarm = audioManager.getStreamMaxVolume(AudioManager.STREAM_ALARM)
                      val curAlarm = audioManager.getStreamVolume(AudioManager.STREAM_ALARM)
                      if (curAlarm < (maxAlarm * 0.65).toInt()) {
                          audioManager.setStreamVolume(AudioManager.STREAM_ALARM, (maxAlarm * 0.75).toInt(), 0)
                      }
                  } catch (_: Exception) {}
              }
          }

          fun playTableKnockSound() {
              Thread {
                  try {
                      val sampleRate = 22050
                      val durationMs = 240
                      val numSamples = (sampleRate * durationMs) / 1000
                      val buffer = ShortArray(numSamples)

                      for (i in 0 until numSamples) {
                          val t = i.toDouble() / sampleRate
                          var sample = 0.0
                          if (t < 0.070) {
                              val env = Math.exp(-t * 60.0)
                              val wave = Math.sin(2.0 * Math.PI * 150.0 * t) * 0.80 +
                                         Math.sin(2.0 * Math.PI * 300.0 * t) * 0.20
                              sample = wave * env
                          } else if (t >= 0.110 && t < 0.195) {
                              val t2 = t - 0.110
                              val env = Math.exp(-t2 * 50.0)
                              val wave = Math.sin(2.0 * Math.PI * 140.0 * t2) * 0.85 +
                                         Math.sin(2.0 * Math.PI * 280.0 * t2) * 0.15
                              sample = wave * env
                          }
                          val pcmVal = (sample * Short.MAX_VALUE).toInt()
                              .coerceIn(Short.MIN_VALUE.toInt(), Short.MAX_VALUE.toInt())
                          buffer[i] = pcmVal.toShort()
                      }

                      val audioTrack = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(buffer.size * 2)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      audioTrack.write(buffer, 0, buffer.size)
                      audioTrack.play()
                      Thread.sleep(270)
                      audioTrack.release()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }.start()
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val pages = loadQuranPages()
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          MaterialTheme {
                              Surface(
                                  modifier = Modifier.fillMaxSize(),
                                  color = Color(0xFFFDFBF7)
                              ) {
                                  QuranSmartScreen(pages)
                              }
                          }
                      }
                  }
              }

              override fun onPause() {
                  super.onPause()
                  setSystemMicBeepMuted(this, false)
              }

              override fun onDestroy() {
                  setSystemMicBeepMuted(this, false)
                  super.onDestroy()
              }

              private fun loadQuranPages(): List<QuranPageData> {
                  val list = mutableListOf<QuranPageData>()
                  try {
                      val jsonStr = assets.open("quran_pages.json").bufferedReader().use { it.readText() }
                      val jsonArray = JSONArray(jsonStr)
                      for (i in 0 until jsonArray.length()) {
                          val obj = jsonArray.getJSONObject(i)
                          val ayahsArr = obj.getJSONArray("ayahs")
                          val ayahList = mutableListOf<AyahItem>()
                          for (j in 0 until ayahsArr.length()) {
                              val aObj = ayahsArr.getJSONObject(j)
                              val rawText = aObj.getString("t")
                              val wordsArr = aObj.optJSONArray("w")
                              val words = mutableListOf<String>()
                              if (wordsArr != null) {
                                  for (k in 0 until wordsArr.length()) {
                                      val w = wordsArr.getString(k)
                                      if (normalizeArabicWord(w).isNotEmpty()) {
                                          words.add(w)
                                      } else if (words.isNotEmpty()) {
                                          words[words.lastIndex] = words.last() + " " + w
                                      }
                                  }
                              } else {
                                  for (token in rawText.split(Regex("\\s+")).filter { it.isNotBlank() }) {
                                      if (normalizeArabicWord(token).isNotEmpty()) {
                                          words.add(token)
                                      } else if (words.isNotEmpty()) {
                                          words[words.lastIndex] = words.last() + " " + token
                                      }
                                  }
                              }
                              ayahList.add(
                                  AyahItem(
                                      surahName = aObj.getString("s"),
                                      numberInSurah = aObj.getInt("n"),
                                      text = rawText,
                                      words = words
                                  )
                              )
                          }
                          list.add(
                              QuranPageData(
                                  page = obj.getInt("page"),
                                  juz = obj.getInt("juz"),
                                  surah = obj.getString("surah"),
                                  ayahs = ayahList
                              )
                          )
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
                  return list
              }
          }

          @Composable
          fun CompactNumberBox(
              value: String,
              onValueChange: (String) -> Unit,
              modifier: Modifier = Modifier
          ) {
              Box(
                  modifier = modifier
                      .width(52.dp)
                      .height(30.dp)
                      .background(Color.White, RoundedCornerShape(6.dp))
                      .border(1.dp, Color(0xFFA9DFBF), RoundedCornerShape(6.dp))
                      .padding(horizontal = 4.dp),
                  contentAlignment = Alignment.Center
              ) {
                  BasicTextField(
                      value = value,
                      onValueChange = { newVal ->
                          val cleanDigits = convertArabicDigitsToEnglish(newVal)
                          if (cleanDigits.length <= 3) {
                              onValueChange(cleanDigits)
                          }
                      },
                      singleLine = true,
                      keyboardOptions = KeyboardOptions(keyboardType = KeyboardType.Number),
                      textStyle = TextStyle(
                          color = Color(0xFF1B4F72),
                          fontSize = 14.sp,
                          fontWeight = FontWeight.Bold,
                          textAlign = TextAlign.Center
                      ),
                      modifier = Modifier.fillMaxWidth()
                  )
              }
          }

          @Composable
          fun QuranSmartScreen(pages: List<QuranPageData>) {
              val context = LocalContext.current
              val focusManager = LocalFocusManager.current
              val mainHandler = remember { Handler(Looper.getMainLooper()) }

              var currentPageIndex by remember { mutableStateOf(0) }
              var pageInputText by remember { mutableStateOf("1") }
              var juzInputText by remember { mutableStateOf("1") }

              var isRecitationMode by remember { mutableStateOf(true) }
              var revealedWordCount by remember { mutableStateOf(0) }
              var cycleStartWordCount by remember { mutableStateOf(0) }
              var hasErrorStop by remember { mutableStateOf(false) }

              var userWantsListening by remember { mutableStateOf(false) }
              var knockedWordIndex by remember { mutableStateOf(-1) }
              var lastKnockedSpokenWord by remember { mutableStateOf("") }

              var statusMessage by remember {
                  mutableStateOf("اختر الصفحة واضغط (اذهب)، ثم اضغط (ابدأ التسميع) لهذه الصفحة")
              }

              val currentPage = if (pages.isNotEmpty() && currentPageIndex in pages.indices) pages[currentPageIndex] else null
              val allPageWords = remember(currentPageIndex, pages) {
                  currentPage?.ayahs?.flatMap { it.words } ?: emptyList()
              }

              // استخدام rememberUpdatedState لضمان قراءة الميكروفون للصفحة الحالية دائماً وليس الصفحة الأولى!
              val currentAllPageWordsState by rememberUpdatedState(allPageWords)
              val currentPageDataState by rememberUpdatedState(currentPage)

              val speechRecognizer = remember {
                  if (SpeechRecognizer.isRecognitionAvailable(context)) {
                      SpeechRecognizer.createSpeechRecognizer(context)
                  } else null
              }

              fun stopListeningCompletely(msg: String? = null) {
                  userWantsListening = false
                  mainHandler.removeCallbacksAndMessages(null)
                  try { speechRecognizer?.cancel() } catch (_: Exception) {}
                  setSystemMicBeepMuted(context, false)
                  if (msg != null) {
                      statusMessage = msg
                  }
              }

              fun startRecognizerCycle() {
                  if (!userWantsListening || speechRecognizer == null) return
                  val wordsOnThisPage = currentAllPageWordsState
                  if (wordsOnThisPage.isEmpty() || revealedWordCount >= wordsOnThisPage.size) {
                      stopListeningCompletely("أحسنت! انتهت هذه الصفحة. اقلب للصفحة التالية واضغط (ابدأ التسميع)")
                      return
                  }
                  setSystemMicBeepMuted(context, true)
                  cycleStartWordCount = revealedWordCount
                  lastKnockedSpokenWord = ""
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                      putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 4)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 3000L)
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 2500L)
                  }
                  try {
                      speechRecognizer.startListening(intent)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun scheduleRestartListening(delayMs: Long = 70L) {
                  mainHandler.removeCallbacksAndMessages(null)
                  val wordsOnThisPage = currentAllPageWordsState
                  if (userWantsListening && revealedWordCount < wordsOnThisPage.size) {
                      mainHandler.postDelayed({
                          if (userWantsListening && revealedWordCount < currentAllPageWordsState.size) {
                              startRecognizerCycle()
                          }
                      }, delayMs)
                  }
              }

              fun jumpToPage(targetPageIndex: Int) {
                  if (targetPageIndex !in pages.indices) return
                  focusManager.clearFocus()
                  // إيقاف أي تسميع سابق عند الانتقال لصفحة جديدة ليبدأ المستخدم الصفحة الجديدة من أولها
                  stopListeningCompletely()
                  currentPageIndex = targetPageIndex
                  val pData = pages[targetPageIndex]
                  pageInputText = pData.page.toString()
                  juzInputText = pData.juz.toString()
                  revealedWordCount = 0
                  cycleStartWordCount = 0
                  hasErrorStop = false
                  knockedWordIndex = -1
                  lastKnockedSpokenWord = ""
                  isRecitationMode = true
                  statusMessage = "أنت في صفحة ${pData.page} (${pData.surah}) — اضغط (ابدأ التسميع) للبدء من أول الصفحة"
              }

              // دالة التقييم الذكي التي تتابع الصفحة الحالية حصراً
              val evaluateSpokenCandidates by rememberUpdatedState { candidates: List<String>, isFinalResult: Boolean ->
                  val wordsOnThisPage = currentAllPageWordsState
                  if (userWantsListening && wordsOnThisPage.isNotEmpty() && revealedWordCount < wordsOnThisPage.size) {
                      var bestReachedWordCount = revealedWordCount
                      var bestUnmatchedTail = Int.MAX_VALUE
                      var sampleWrongWord = ""

                      for (sentence in candidates) {
                          val spokenWords = sentence.trim()
                              .split(Regex("\\s+"))
                              .filter { normalizeArabicWord(it).isNotEmpty() }
                          if (spokenWords.isEmpty()) continue

                          var simCursor = cycleStartWordCount
                          var sIdx = 0
                          var unmatchedAfterProgress = 0
                          var firstWrong = ""

                          while (sIdx < spokenWords.size && simCursor < wordsOnThisPage.size) {
                              val sw = spokenWords[sIdx]
                              val expected = wordsOnThisPage[simCursor]

                              // 1. مطابقة الكلمة المتوقعة مباشرة
                              if (wordsMatch(expected, sw)) {
                                  simCursor++
                                  sIdx++
                                  unmatchedAfterProgress = 0
                                  firstWrong = ""
                                  continue
                              }

                              // 2. مطابقة كلمتين منطوقتين بكلمة قرآنية واحدة (مثل: يا أيها -> ياأيها)
                              if (sIdx + 1 < spokenWords.size &&
                                  wordsMatch(expected, sw + spokenWords[sIdx + 1])
                              ) {
                                  simCursor++
                                  sIdx += 2
                                  unmatchedAfterProgress = 0
                                  firstWrong = ""
                                  continue
                              }

                              // 3. مطابقة كلمة منطوقة بكلمتين قرآنيتين
                              if (simCursor + 1 < wordsOnThisPage.size &&
                                  wordsMatch(expected + wordsOnThisPage[simCursor + 1], sw)
                              ) {
                                  simCursor += 2
                                  sIdx++
                                  unmatchedAfterProgress = 0
                                  firstWrong = ""
                                  continue
                              }

                              // 4. تجاهل الاستعاذة والبسملة في بداية الصفحة إذا لم تكن هي الآية المطلوبة
                              if (simCursor == 0 && normalizeArabicWord(sw) in ignoredIntroWords) {
                                  sIdx++
                                  continue
                              }

                              // 5. تجاهل الكلمة السابقة إذا كررها المايك أو أعادها القارئ ليربط الآية
                              if (simCursor > 0 && wordsMatch(wordsOnThisPage[simCursor - 1], sw)) {
                                  sIdx++
                                  continue
                              }
                              if (simCursor > 1 && wordsMatch(wordsOnThisPage[simCursor - 2], sw)) {
                                  sIdx++
                                  continue
                              }

                              // 6. إذا التقط المايك الكلمة التالية بعد حرف قصير (من/في/إن/لا/ما/و)
                              if (simCursor + 1 < wordsOnThisPage.size &&
                                  wordsMatch(wordsOnThisPage[simCursor + 1], sw) &&
                                  normalizeArabicWord(expected).length <= 3
                              ) {
                                  simCursor += 2
                                  sIdx++
                                  unmatchedAfterProgress = 0
                                  firstWrong = ""
                                  continue
                              }

                              if (firstWrong.isEmpty()) firstWrong = sw
                              unmatchedAfterProgress++
                              sIdx++
                          }

                          if (simCursor > bestReachedWordCount ||
                              (simCursor == bestReachedWordCount && unmatchedAfterProgress < bestUnmatchedTail)
                          ) {
                              bestReachedWordCount = simCursor
                              bestUnmatchedTail = unmatchedAfterProgress
                              sampleWrongWord = firstWrong
                          }
                      }

                      // إذا نطق القارئ الكلمة الصحيحة نظهرها فوراً ونكمل التسميع
                      if (bestReachedWordCount > revealedWordCount) {
                          revealedWordCount = bestReachedWordCount
                          hasErrorStop = false
                          knockedWordIndex = -1
                          lastKnockedSpokenWord = ""

                          // إذا وصل لنهاية الصفحة الحالية: يوقف التسميع تماماً ولا يكمل للصفحة التالية!
                          if (revealedWordCount >= wordsOnThisPage.size) {
                              stopListeningCompletely(
                                  "أحسنت! أتممت تسميع صفحة ${currentPageDataState?.page ?: ""} بالكامل. انتقل للصفحة التالية واضغط (ابدأ التسميع)"
                              )
                          } else {
                              statusMessage = "تلاوة صحيحة.. تابع القراءة"
                          }
                      } else {
                          // التحقق من الخطأ: إذا خربط القارئ يتوقف المؤشر وينقر على الطاولة وينتظره
                          val isMistakeNow = (isFinalResult && bestUnmatchedTail >= 1) ||
                                             (!isFinalResult && bestUnmatchedTail >= 2)

                          if (isMistakeNow && sampleWrongWord.isNotEmpty()) {
                              val normWrong = normalizeArabicWord(sampleWrongWord)
                              if (knockedWordIndex != revealedWordCount || normWrong != lastKnockedSpokenWord) {
                                  knockedWordIndex = revealedWordCount
                                  lastKnockedSpokenWord = normWrong
                                  hasErrorStop = true
                                  playTableKnockSound()
                                  statusMessage = "تنبيه (نقرة)! أخطأت في الكلمة — صححها بصوتك أو اضغط (أكمل الآية)"
                              }
                          }
                      }
                  }
              }

              LaunchedEffect(speechRecognizer) {
                  speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {
                          if (!hasErrorStop) {
                              statusMessage = "يستمع إليك الآن في صفحة ${currentPageDataState?.page ?: ""}.. اقرأ"
                          }
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          if (userWantsListening) {
                              scheduleRestartListening(80L)
                          }
                      }
                      override fun onResults(results: Bundle?) {
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              evaluateSpokenCandidates(matches, true)
                          }
                          if (userWantsListening && revealedWordCount < currentAllPageWordsState.size) {
                              scheduleRestartListening(50L)
                          }
                      }
                      override fun onPartialResults(partialResults: Bundle?) {
                          val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              evaluateSpokenCandidates(matches, false)
                          }
                      }
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
              }

              DisposableEffect(Unit) {
                  onDispose {
                      mainHandler.removeCallbacksAndMessages(null)
                      setSystemMicBeepMuted(context, false)
                      speechRecognizer?.destroy()
                  }
              }

              val permissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { isGranted ->
                  if (isGranted) {
                      userWantsListening = true
                      startRecognizerCycle()
                  } else {
                      statusMessage = "يرجى السماح بصلاحية الميكروفون لتفعيل التسميع الصوتي"
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(8.dp),
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  // الشريط العلوي الأزرق المدمج
                  Card(
                      modifier = Modifier.fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFF1B4F72)),
                      shape = RoundedCornerShape(10.dp)
                  ) {
                      Column(
                          modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = if (currentPage != null)
                                      "مصحفي | ${currentPage.surah} (ص ${currentPage.page} - ج ${currentPage.juz})"
                                  else "مصحفي الذكي",
                                  color = Color.White,
                                  fontSize = 14.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Button(
                                  onClick = { isRecitationMode = !isRecitationMode },
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = if (isRecitationMode) Color(0xFF117864) else Color(0xFF2874A6)
                                  ),
                                  contentPadding = PaddingValues(horizontal = 8.dp, vertical = 2.dp),
                                  modifier = Modifier.height(28.dp)
                              ) {
                                  Text(
                                      text = if (isRecitationMode) "وضع التسميع" else "قراءة كاملة",
                                      color = Color.White,
                                      fontSize = 11.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                          }

                          // الأزرار الزرقاء الصغيرة على مسار أفقي واحد
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(4.dp)
                              ) {
                                  Text(
                                      text = "صفحة:",
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  CompactNumberBox(
                                      value = pageInputText,
                                      onValueChange = { pageInputText = it }
                                  )
                                  Button(
                                      onClick = {
                                          val targetPage = pageInputText.toIntOrNull()
                                          if (targetPage != null && targetPage in 1..pages.size) {
                                              jumpToPage(targetPage - 1)
                                          } else {
                                              statusMessage = "أدخل رقم صفحة صحيح بين 1 و 604"
                                          }
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2874A6)),
                                      contentPadding = PaddingValues(horizontal = 10.dp, vertical = 0.dp),
                                      modifier = Modifier.height(30.dp)
                                  ) {
                                      Text("اذهب", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                              }

                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(4.dp)
                              ) {
                                  Text(
                                      text = "جزء:",
                                      color = Color.White,
                                      fontSize = 12.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  CompactNumberBox(
                                      value = juzInputText,
                                      onValueChange = { juzInputText = it }
                                  )
                                  Button(
                                      onClick = {
                                          val targetJuz = juzInputText.toIntOrNull()
                                          if (targetJuz != null && targetJuz in 1..30) {
                                              val foundIndex = pages.indexOfFirst { it.juz == targetJuz }
                                              if (foundIndex >= 0) jumpToPage(foundIndex)
                                          } else {
                                              statusMessage = "أدخل رقم جزء صحيح بين 1 و 30"
                                          }
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2874A6)),
                                      contentPadding = PaddingValues(horizontal = 10.dp, vertical = 0.dp),
                                      modifier = Modifier.height(30.dp)
                                  ) {
                                      Text("اذهب", fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }
                  }

                  // شريط التنبيهات والحالة
                  Card(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(vertical = 4.dp),
                      colors = CardDefaults.cardColors(
                          containerColor = if (hasErrorStop) Color(0xFFFADBD8) else Color(0xFFE8F8F5)
                      )
                  ) {
                      Text(
                          text = statusMessage,
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(6.dp),
                          color = if (hasErrorStop) Color(0xFFC0392B) else Color(0xFF117864),
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold,
                          textAlign = TextAlign.Center
                      )
                  }

                  // لوحة عرض الآيات الكريمة للصفحة الحالية
                  Card(
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth(),
                      colors = CardDefaults.cardColors(containerColor = Color(0xFFFFF8E7)),
                      elevation = CardDefaults.cardElevation(defaultElevation = 4.dp),
                      shape = RoundedCornerShape(12.dp)
                  ) {
                      val scrollState = rememberScrollState()
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .padding(14.dp)
                              .verticalScroll(scrollState),
                          horizontalAlignment = Alignment.CenterHorizontally
                      ) {
                          if (currentPage != null) {
                              val annotatedPageText = buildAnnotatedString {
                                  var globalWordIndex = 0
                                  for (ayah in currentPage.ayahs) {
                                      for (word in ayah.words) {
                                          if (!isRecitationMode || globalWordIndex < revealedWordCount) {
                                              withStyle(
                                                  SpanStyle(
                                                      color = Color(0xFF1E8449),
                                                      fontWeight = FontWeight.Bold
                                                  )
                                              ) {
                                                  append("$word ")
                                              }
                                          } else if (globalWordIndex == revealedWordCount && hasErrorStop) {
                                              withStyle(
                                                  SpanStyle(
                                                      color = Color(0xFFC0392B),
                                                      background = Color(0xFFF5B7B1),
                                                      fontWeight = FontWeight.Bold
                                                  )
                                              ) {
                                                  append("[؟] ")
                                              }
                                          } else {
                                              withStyle(
                                                  SpanStyle(color = Color(0xFFBDC3C7))
                                              ) {
                                                  append("••• ")
                                              }
                                          }
                                          globalWordIndex++
                                      }
                                      withStyle(
                                          SpanStyle(
                                              color = Color(0xFFB7950B),
                                              fontWeight = FontWeight.Bold
                                          )
                                      ) {
                                          append("﴿${ayah.numberInSurah}﴾ ")
                                      }
                                  }
                              }

                              Text(
                                  text = annotatedPageText,
                                  fontSize = 22.sp,
                                  lineHeight = 40.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      }
                  }

                  // الأزرار السفلية المدمجة
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(top = 6.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Button(
                              onClick = {
                                  focusManager.clearFocus()
                                  isRecitationMode = true

                                  // إذا كتب المستخدم رقم صفحة في المربع ولم يضغط "اذهب"، ننتقل إليها تلقائياً قبل بدء التسميع
                                  val typedPage = pageInputText.toIntOrNull()
                                  if (typedPage != null && typedPage in 1..pages.size && typedPage - 1 != currentPageIndex) {
                                      jumpToPage(typedPage - 1)
                                  }

                                  if (userWantsListening) {
                                      stopListeningCompletely("تم إيقاف التسميع مؤقتاً")
                                  } else {
                                      // إذا كانت الصفحة مكتملة سابقاً وضغط "ابدأ التسميع"، نبدأ الصفحة من أولها
                                      if (revealedWordCount >= currentAllPageWordsState.size) {
                                          revealedWordCount = 0
                                          cycleStartWordCount = 0
                                      }
                                      val perm = ContextCompat.checkSelfPermission(
                                          context,
                                          Manifest.permission.RECORD_AUDIO
                                      )
                                      if (perm == PackageManager.PERMISSION_GRANTED) {
                                          hasErrorStop = false
                                          knockedWordIndex = -1
                                          lastKnockedSpokenWord = ""
                                          userWantsListening = true
                                          startRecognizerCycle()
                                      } else {
                                          permissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                                      }
                                  }
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .height(36.dp),
                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),
                              colors = ButtonDefaults.buttonColors(
                                  containerColor = if (userWantsListening) Color(0xFFC0392B) else Color(0xFF1E8449)
                              )
                          ) {
                              Text(
                                  text = if (userWantsListening) "إيقاف التسميع" else "ابدأ التسميع",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  maxLines = 1
                              )
                          }

                          Button(
                              onClick = {
                                  isRecitationMode = true
                                  val wordsOnThisPage = currentAllPageWordsState
                                  if (revealedWordCount < wordsOnThisPage.size) {
                                      val helpedWord = wordsOnThisPage[revealedWordCount]
                                      revealedWordCount++
                                      cycleStartWordCount = revealedWordCount
                                      hasErrorStop = false
                                      knockedWordIndex = -1
                                      lastKnockedSpokenWord = ""

                                      if (revealedWordCount >= wordsOnThisPage.size) {
                                          stopListeningCompletely("انتهت الصفحة الحالية. اقلب للصفحة التالية واضغط (ابدأ التسميع)")
                                      } else {
                                          statusMessage = "الكلمة هي « $helpedWord » — تابع القراءة لنهاية الصفحة"
                                          if (userWantsListening) {
                                              try { speechRecognizer?.cancel() } catch (_: Exception) {}
                                              scheduleRestartListening(60L)
                                          }
                                      }
                                  } else {
                                      statusMessage = "جميع كلمات هذه الصفحة ظاهرة بالفعل!"
                                  }
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .height(36.dp),
                              contentPadding = PaddingValues(horizontal = 8.dp, vertical = 0.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFD35400))
                          ) {
                              Text(
                                  text = "أكمل الكلمة",
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  maxLines = 1
                              )
                          }
                      }

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          Button(
                              onClick = {
                                  if (currentPageIndex > 0) {
                                      jumpToPage(currentPageIndex - 1)
                                  }
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .height(34.dp),
                              contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1B4F72))
                          ) {
                              Text("الصفحة السابقة", fontSize = 11.sp, maxLines = 1)
                          }

                          // زر أكمل الآية: يكشف الآية الحالية ويكمل الاستماع من بعدها لنهاية الصفحة فقط
                          Button(
                              onClick = {
                                  val pageData = currentPageDataState
                                  val wordsOnThisPage = currentAllPageWordsState
                                  if (pageData != null && revealedWordCount < wordsOnThisPage.size) {
                                      isRecitationMode = true
                                      var count = 0
                                      var revealedAyahNum = 1
                                      for (ayah in pageData.ayahs) {
                                          count += ayah.words.size
                                          if (count > revealedWordCount) {
                                              revealedWordCount = count
                                              cycleStartWordCount = count
                                              revealedAyahNum = ayah.numberInSurah
                                              break
                                          }
                                      }
                                      hasErrorStop = false
                                      knockedWordIndex = -1
                                      lastKnockedSpokenWord = ""

                                      if (revealedWordCount >= wordsOnThisPage.size) {
                                          stopListeningCompletely(
                                              "تم كشف الآية ($revealedAyahNum) وانتهت الصفحة. اقلب للصفحة التالية واضغط (ابدأ التسميع)"
                                          )
                                      } else {
                                          statusMessage = "تم كشف الآية ($revealedAyahNum) — تابع التلاوة من الآية التالية لنهاية الصفحة"
                                          if (userWantsListening) {
                                              try { speechRecognizer?.cancel() } catch (_: Exception) {}
                                              scheduleRestartListening(60L)
                                          }
                                      }
                                  }
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .height(34.dp),
                              contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF8E44AD))
                          ) {
                              Text("أكمل الآية", fontSize = 11.sp, maxLines = 1)
                          }

                          Button(
                              onClick = {
                                  if (currentPageIndex < pages.size - 1) {
                                      jumpToPage(currentPageIndex + 1)
                                  }
                              },
                              modifier = Modifier
                                  .weight(1f)
                                  .height(34.dp),
                              contentPadding = PaddingValues(horizontal = 6.dp, vertical = 0.dp),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF1B4F72))
                          ) {
                              Text("الصفحة التالية", fontSize = 11.sp, maxLines = 1)
                          }
                      }
                  }
              }
          }
          EOF

